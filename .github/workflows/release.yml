name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-electron:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build

      - name: Build Electron Main
        run: npm run electron:build

      - name: Build Electron App
        run: npx electron-builder --publish never --win nsis

      - name: List release files
        shell: pwsh
        run: |
          Write-Host "Release directory contents:"
          if (Test-Path "release") {
            Get-ChildItem -Path "release" -Recurse | Format-Table Name, Length, FullName
            Write-Host "Looking for .exe files:"
            $exeFiles = Get-ChildItem -Path "release" -Filter "*.exe" -Recurse
            if ($exeFiles) {
              $exeFiles | ForEach-Object { Write-Host "Found: $($_.FullName)" }
            } else {
              Write-Host "No .exe files found"
            }
          } else {
            Write-Host "Release directory does not exist"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            release/*.exe
            release/*.exe.blockmap

      - name: Publish Release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          artifacts: "release/*.exe,release/*.exe.blockmap"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          # Only *-beta* tags are marked Pre-release; v1.0.0 is a full release
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          name: One Trick ${{ github.ref_name }}
          body: |
            **One Trick ${{ github.ref_name }}** — production release.

            ### Install
            - Download the Windows `.exe` from Assets below
            - Use **Borderless** display mode in League
            - Open the League client, connect in One Trick, hit **Sync LoL**, then unlock the overlay (Ctrl+Shift+U) → **Align HUD**

            ### In-game
            - **PageUp** / **Numpad 9** — toggle primary Flash (ADC or Mid)
            - **PageDown** / **Numpad 3** — Support Flash, or Mid Ignite/TP
            - Works while League has focus (low-level keyboard hook). If League is Run as Administrator, run One Trick elevated too.
            - Ctrl+Shift+U unlock/lock · Ctrl+Shift+H hide
            - Main window parks during matches on purpose — live HUD is the overlay

            ### Highlights
            - Fix mid-match mouse hitch: no ignore-mouse re-arm / `forward` when locked
            - LCU reconnect prefers lockfile; long backoff mid-match (avoids PowerShell freezes)
            - Fewer overlay IPC/React rebuilds (10s fingerprint buckets)
            - Mid-match HUD holds through Live Client blips; PageUp/PageDown rebind
            - Smite jungle tracking + lower overlay DWM churn
          generateReleaseNotes: true
