name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Overlay cue policy
        run: npm run verify:cues

      - name: Champion icon catalog
        run: npm run verify:icons

      - name: Live catalog profiles
        run: npm run verify:catalog

      - name: HUD layout schema
        run: npm run verify:layout

      - name: Overlay window bounds
        run: npm run verify:overlay-bounds

      - name: Verify summoner timers
        run: npm run verify:summoners

      - name: Verify match stats
        run: npm run verify:stats
      - name: Build TypeScript
        run: npm run electron:build

      - name: Build Web
        run: npm run build

      - name: Check for TypeScript errors
        run: npx tsc --noEmit

      - name: Build keyboard hotkey helper
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64
          npm run build:keyhook

      - name: Upload hotkey helper
        uses: actions/upload-artifact@v4
        with:
          name: onetrick-keys
          path: native/bin/onetrick-keys.exe
          if-no-files-found: error

  release-electron:
    needs: quality-gates
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify packaging metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.build) { throw "Missing build config in package.json" }
          if ($pkg.build.win.signAndEditExecutable -ne $false) { throw "win.signAndEditExecutable must remain false" }
          if (-not (Test-Path "build/icon.ico")) { throw "Missing build/icon.ico" }
          $targets = @($pkg.build.win.target)
          if (-not ($targets -contains "nsis")) { throw "win.target must include nsis" }
          if (-not ($targets -contains "portable")) { throw "win.target must include portable" }
          if (-not $pkg.build.nsis.installerIcon -or -not $pkg.build.nsis.uninstallerIcon -or -not $pkg.build.nsis.installerHeaderIcon) {
            throw "NSIS icon metadata is incomplete"
          }

      - name: Download hotkey helper
        uses: actions/download-artifact@v4
        with:
          name: onetrick-keys
          path: native/bin

      - name: Verify hotkey helper
        shell: pwsh
        run: if (-not (Test-Path "native/bin/onetrick-keys.exe")) { throw "Missing native/bin/onetrick-keys.exe hotkey helper" }

      - name: Build Web
        run: npm run build

      - name: Build Electron Main
        run: npm run electron:build

      - name: Build Electron App
        run: npx electron-builder --publish never --win nsis

      - name: List release files
        shell: pwsh
        run: |
          Write-Host "Release directory contents:"
          if (Test-Path "release") {
            Get-ChildItem -Path "release" -Recurse | Format-Table Name, Length, FullName
            Write-Host "Looking for .exe files:"
            $exeFiles = Get-ChildItem -Path "release" -Filter "*.exe" -Recurse
            if ($exeFiles) {
              $exeFiles | ForEach-Object { Write-Host "Found: $($_.FullName)" }
            } else {
              Write-Host "No .exe files found"
            }
          } else {
            Write-Host "Release directory does not exist"
          }

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "release" -Filter "*.exe" -Recurse | Where-Object { $_.Name -match "Setup" }
          $portable = Get-ChildItem -Path "release" -Filter "*.exe" -Recurse | Where-Object { $_.Name -notmatch "Setup" }
          if (-not $installer) { throw "Missing NSIS setup executable" }
          if (-not $portable) { throw "Missing portable executable" }
          $blockmaps = Get-ChildItem -Path "release" -Filter "*.exe.blockmap" -Recurse
          if (-not $blockmaps) { throw "Missing blockmap artifacts" }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            release/*.exe
            release/*.exe.blockmap

      - name: Publish Release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          artifacts: "release/*.exe,release/*.exe.blockmap"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          # Only *-beta* tags are marked Pre-release; v1.0.0 / v1.1.0 are full releases
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          makeLatest: ${{ !contains(github.ref_name, 'beta') }}
          name: One Trick ${{ github.ref_name }}
          body: |
            **One Trick ${{ github.ref_name }}** — production release.

            ### Install
            - Download **One.Trick.Setup** from Assets below
            - Use **Borderless** display mode in League
            - Open the League client, connect in One Trick, then export in champ select
            - Overlay HUD modules: Sums, Gank, Vision, Buy, Action (Frames off by default)
            - **Sync LoL** if you enable Frames and need HUD/minimap alignment
            - Pin a custom HUD in the companion **Studio** tab, or at https://one-trick-client.vercel.app/studio/

            ### In-game
            - **PageUp** / **Numpad 9** — toggle primary Flash (ADC or Mid)
            - **PageDown** / **Numpad 3** — Support Flash, or Mid Ignite/TP
            - Works while League has focus (keyboard-only hook helper, no mouse hook). If League is Run as Administrator, run One Trick elevated too.
            - Ctrl+Shift+U unlock/lock · Ctrl+Shift+H hide
            - Main window hides to the tray during matches on purpose — live HUD is the overlay

            ### Highlights
            - Live catalog API so every champion resolves (authored Pyke / Pantheon / Yone stay deep)
            - HUD studio: drag modules and chrome stickers onto the League HUD / minimap map
            - Overlay places widgets from saved layout JSON (dual-rail default)
            - Locked overlay uses slim rail windows — not a fullscreen transparent layer over League
            - Next-move cue ranking with a 6s hold / +12 switch margin
            - Site + studio on Vercel; desktop still owns LCU export and the click-through overlay
          generateReleaseNotes: true
