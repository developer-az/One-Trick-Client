name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Overlay cue policy
        run: npm run verify:cues

      - name: Champion icon catalog
        run: npm run verify:icons

      - name: Live catalog profiles
        run: npm run verify:catalog

      - name: HUD layout schema
        run: npm run verify:layout

      - name: Overlay window bounds
        run: npm run verify:overlay-bounds

      - name: Verify summoner timers
        run: npm run verify:summoners

      - name: Verify match stats
        run: npm run verify:stats

      - name: Overlay stays up for the whole match
        run: npm run verify:match

      - name: Jungle threat heuristics
        run: npm run verify:jungle

      - name: Cannon wave cues
        run: npm run verify:wave

      - name: Loss matchup insights
        run: npm run verify:loss-insights

      - name: Ranked SR guards (Mayhem isolated)
        run: npm run verify:ranked

      - name: ARAM Mayhem augment ranker
        run: npm run verify:mayhem

      - name: Mayhem OCR name match
        run: npm run verify:mayhem-match

      - name: Mayhem HUD visibility (OCR-gated)
        run: npm run verify:mayhem-visibility

      - name: verify mayhem OCR (Windows OCR + matcher)
        run: npm run verify:mayhem-ocr

      - name: Global hotkey + summoner toggle logic
        run: npm run verify:global-hotkeys

      - name: Mayhem augment OCR schedule
        run: npm run verify:augment-schedule

      - name: Play moment cues
        run: npm run verify:play-moments

      - name: Live coach rule engine
        run: npm run verify:coach

      - name: Clip planner math
        run: npm run verify:clipper

      - name: State service (Live Client event cursor, objective timers)
        run: npm run verify:game-state

      - name: Clipper lifecycle and stitch queue
        run: npm run verify:clipper-lifecycle

      - name: State service module and lifecycle
        run: npm run verify:state-service

      - name: Game monitor HUD tick and fingerprint
        run: npm run verify:game-monitor

      - name: IPC surface handlers
        run: npm run verify:ipc-surface

      - name: Vision HUD geometry matrix
        run: npm run verify:hud-geometry

      - name: Windows packaging metadata
        run: npm run verify:packaging

      - name: Build TypeScript
        run: npm run electron:build

      - name: Build Web
        run: npm run build

      - name: Electron dist paths
        run: npm run verify:electron-paths

      - name: Check for TypeScript errors
        run: npx tsc --noEmit

      - name: Build keyboard hotkey helper
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64
          npm run build:keyhook

      - name: Upload hotkey helper
        uses: actions/upload-artifact@v4
        with:
          name: onetrick-keys
          path: native/bin/onetrick-keys.exe
          if-no-files-found: error

  release-electron:
    needs: quality-gates
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify packaging metadata
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.build) { throw "Missing build config in package.json" }
          if ($pkg.build.win.signAndEditExecutable -ne $true) { throw "win.signAndEditExecutable must be true so the exe embeds build/icon.ico" }
          if ($pkg.name -ne 'one-trick') { throw "package name must be one-trick (not legacy pyke-dominator)" }
          if (-not (Test-Path "build/installer.nsh")) { throw "Missing build/installer.nsh for legacy shortcut cleanup" }
          if (-not (Test-Path "build/icon.ico")) { throw "Missing build/icon.ico" }
          if (-not (Test-Path "packaging/INSTALL.txt")) { throw "Missing packaging/INSTALL.txt" }
          if (-not $pkg.build.extraFiles) { throw "build.extraFiles must ship INSTALL.txt" }
          $targets = @($pkg.build.win.target)
          if (-not ($targets -contains "zip")) { throw "win.target must include zip" }
          if (-not ($targets -contains "nsis")) { throw "win.target must include nsis" }
          if ($pkg.build.win.requestedExecutionLevel -ne "asInvoker") { throw "win.requestedExecutionLevel must remain asInvoker" }
          if ($pkg.build.nsis.perMachine -ne $false) { throw "nsis.perMachine must remain false" }
          if ($pkg.build.nsis.allowElevation -ne $false) { throw "nsis.allowElevation must remain false" }
          if (-not $pkg.build.nsis.installerIcon -or -not $pkg.build.nsis.uninstallerIcon -or -not $pkg.build.nsis.installerHeaderIcon) {
            throw "NSIS icon metadata is incomplete"
          }

      - name: Download hotkey helper
        uses: actions/download-artifact@v4
        with:
          name: onetrick-keys
          path: native/bin

      - name: Verify hotkey helper
        shell: pwsh
        run: if (-not (Test-Path "native/bin/onetrick-keys.exe")) { throw "Missing native/bin/onetrick-keys.exe hotkey helper" }

      - name: Build Web
        run: npm run build

      - name: Build Electron Main
        run: npm run electron:build

      - name: Electron dist paths
        run: npm run verify:electron-paths

      - name: Build Electron App
        run: npx electron-builder --publish never --win zip nsis

      - name: List release files
        shell: pwsh
        run: |
          Write-Host "Release directory contents:"
          if (Test-Path "release") {
            Get-ChildItem -Path "release" -Recurse | Format-Table Name, Length, FullName
            Write-Host "Looking for .exe files:"
            $exeFiles = Get-ChildItem -Path "release" -Filter "*.exe" -Recurse
            if ($exeFiles) {
              $exeFiles | ForEach-Object { Write-Host "Found: $($_.FullName)" }
            } else {
              Write-Host "No .exe files found"
            }
          } else {
            Write-Host "Release directory does not exist"
          }

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "release" -Filter "*.exe" -Recurse | Where-Object { $_.Name -match "Setup" }
          $zip = Get-ChildItem -Path "release" -Filter "*.zip" -Recurse | Where-Object { $_.Name -notmatch "blockmap" }
          if (-not $installer) { throw "Missing NSIS setup executable" }
          if (-not $zip) { throw "Missing zip archive" }
          $blockmaps = Get-ChildItem -Path "release" -Filter "*.exe.blockmap" -Recurse
          if (-not $blockmaps) { throw "Missing blockmap artifacts" }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.zip

      - name: Publish Release
        uses: ncipollo/release-action@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          artifacts: "release/*.zip,release/*.exe,release/*.exe.blockmap"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          draft: false
          # Only *-beta* tags are marked Pre-release; v1.0.0 / v1.1.0 are full releases
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          makeLatest: ${{ !contains(github.ref_name, 'beta') }}
          name: One Trick ${{ github.ref_name }}
          body: |
            **One Trick ${{ github.ref_name }}** — production release.

            ### Install
            - Download the **One.Trick zip** from Assets below
            - Extract it, keep the folder (Documents is fine), and run **OneTrick.exe**
            - Windows may ask once on first launch. Choose **More info**, then **Run anyway**
            - Optional: **One.Trick.Setup** adds a Start menu shortcut for the current user and does not request administrator
            - Use **Borderless** display mode in League
            - Open the League client, connect in One Trick, then export in champ select
            - Overlay HUD modules: Sums, Gank, Vision, Buy, Action (Frames off by default)
            - **Sync LoL** if you enable Frames and need HUD/minimap alignment
            - Pin a custom HUD in the companion **Studio** tab, or at https://one-trick-client.vercel.app/studio/

            ### In-game
            - **PageUp** / **Numpad 9** — toggle primary Flash (ADC or Mid)
            - **PageDown** / **Numpad 3** — Support Flash, or Mid Ignite/TP
            - Works while League has focus (keyboard-only hook helper, no mouse hook). If League is Run as Administrator, run One Trick elevated too.
            - Ctrl+Shift+U unlock/lock · Ctrl+Shift+H hide
            - Main window hides to the tray during matches on purpose — live HUD is the overlay

            ### Highlights
            - **ARAM Mayhem (beta)** — augment OCR + rankings; enable **Mayhem (beta)** in overlay modules for Mayhem queues only
            - Mayhem HUD shows only when OCR sees augment card names (not during normal SR/ranked play)
            - **Page Down** scan / **Page Up** dismiss augment overlay in Mayhem
            - Ranked & SR: summoner timers, gank, vision, buy, jungle/wave cues unchanged; Mayhem off by default
            - Live catalog API so every champion resolves (authored Pyke / Pantheon / Yone stay deep)
            - HUD studio: drag modules and chrome stickers onto the League HUD / minimap map
            - Locked overlay uses slim rail windows — not a fullscreen transparent layer over League
            - Next-move cue ranking with a 6s hold / +12 switch margin
          generateReleaseNotes: true
