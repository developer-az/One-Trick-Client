name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/catalog/**'
      - 'src/overlay/hudLayout.ts'
      - 'scripts/generate-catalog.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Generate live catalog API
        working-directory: .
        run: |
          npm ci
          npm run catalog:generate

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Project Pages URL: https://<user>.github.io/One-Trick-Client/
          VITE_BASE: /One-Trick-Client/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
